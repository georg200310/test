
name: Unpack VideoLibre

on:
  push:
    paths:
      - 'videolibre-source.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Extract project
        run: |
          if [ ! -f videolibre-source.zip ]; then
            echo "ZIP not found"
            exit 0
          fi

          unzip -o videolibre-source.zip -d .
          rm videolibre-source.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Unpack VideoLibre files"
          git push origin "HEAD:${GITHUB_REF_NAME}"
