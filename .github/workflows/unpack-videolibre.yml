
    
  
name: Unpack VideoLibre

on:
  push:
    paths:
      - 'videolibre-source.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Extract VideoLibre project
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f videolibre-source.zip ]]; then
            echo "ERROR: videolibre-source.zip was not found in the repository root."
            exit 1
          fi

          mkdir -p .unpack-temp
          unzip -oq videolibre-source.zip -d .unpack-temp

          # Copy project files into repository root while preserving folders.
          cp -a .unpack-temp/. .
          rm -rf .unpack-temp
          rm -f videolibre-source.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi

          git commit -m "Extract VideoLibre project files"
          git push origin "HEAD:${GITHUB_REF_NAME}"

