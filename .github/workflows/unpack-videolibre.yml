
name: Unpack VideoLibre

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract VideoLibre
        shell: bash
        run: |
          set -e

          ZIP=""

          for name in \
            videolibre-source.zip \
            VideoLibre-v8-GitHub-Upload.zip \
            VideoLibre-v8-Komplettpaket.zip
          do
            if [ -f "$name" ]; then
              ZIP="$name"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            echo "Keine VideoLibre ZIP im Hauptordner gefunden."
            exit 1
          fi

          mkdir -p /tmp/videolibre
          unzip -oq "$ZIP" -d /tmp/videolibre

          SOURCE="/tmp/videolibre"

          if [ ! -f "$SOURCE/Dockerfile" ]; then
            for folder in /tmp/videolibre/*; do
              if [ -f "$folder/Dockerfile" ]; then
                SOURCE="$folder"
                break
              fi
            done
          fi

          if [ ! -f "$SOURCE/Dockerfile" ]; then
            echo "Dockerfile nicht gefunden!"
            exit 1
          fi

          cp -a "$SOURCE"/. .
          rm -f "$ZIP"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "Extract VideoLibre project"
          git push origin HEAD:main
