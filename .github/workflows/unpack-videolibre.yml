
name: Unpack VideoLibre

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Unpack
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""

          for file in \
            VideoLibre-Upload.zip \
            videolibre-source.zip \
            VideoLibre-v8-GitHub-Upload.zip \
            VideoLibre-v8-Komplettpaket.zip
          do
            if [ -f "$file" ]; then
              ZIP="$file"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            echo "ERROR: Keine passende ZIP im Hauptverzeichnis."
            ls -la
            exit 1
          fi

          echo "Entpacke: $ZIP"

          unzip -tq "$ZIP"
          mkdir -p /tmp/videolibre
          unzip -oq "$ZIP" -d /tmp/videolibre

          SOURCE="/tmp/videolibre"

          if [ ! -f "$SOURCE/Dockerfile" ]; then
            FOUND=$(find /tmp/videolibre -name Dockerfile -print -quit)
            if [ -z "$FOUND" ]; then
              echo "ERROR: Dockerfile fehlt im Archiv."
              find /tmp/videolibre -maxdepth 3 -type f
              exit 1
            fi
            SOURCE="$(dirname "$FOUND")"
          fi

          for file in app.py render.yaml requirements.txt; do
            test -f "$SOURCE/$file" || {
              echo "ERROR: $file fehlt."
              exit 1
            }
          done

          cp -a "$SOURCE"/. .
          rm -f "$ZIP"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Extract VideoLibre"
          git push origin "HEAD:${GITHUB_REF_NAME}"
